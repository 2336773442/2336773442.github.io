<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1228"/>
      <stop offset="55%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatarRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9FFC"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#5227FF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#B497CF"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E9FF"/>
      <stop offset="100%" stop-color="#D8C7EE"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#halo)"/>

  <!-- avatar frame -->
  <g filter="url(#glow)">
    <rect x="170" y="150" width="300" height="300" rx="60" fill="none" stroke="url(#avatarRing)" stroke-width="6"/>
  </g>

  <!-- head -->
  <circle cx="320" cy="272" r="62" fill="url(#headGrad)" stroke="#C4B5FD" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- hair -->
  <path d="M258 260 Q260 196 320 192 Q380 196 382 260 Q372 218 320 214 Q268 218 258 260 Z" fill="#4C1D95"/>
  <path d="M264 300 Q262 240 320 236 Q378 240 376 300 Q368 258 320 254 Q272 258 264 300 Z" fill="#7C3AED" opacity="0.85"/>
  <!-- eyes -->
  <ellipse cx="296" cy="276" rx="8" ry="10" fill="#2a1a4a"/>
  <ellipse cx="344" cy="276" rx="8" ry="10" fill="#2a1a4a"/>
  <circle cx="299" cy="272" r="3" fill="#FF9FFC"/>
  <circle cx="347" cy="272" r="3" fill="#FF9FFC"/>
  <!-- smile -->
  <path d="M302 302 Q320 316 338 302" fill="none" stroke="#6d5a94" stroke-width="4" stroke-linecap="round"/>
  <!-- body -->
  <path d="M252 472 Q258 384 320 380 Q382 384 388 472 L392 560 Q392 590 370 590 L270 590 Q248 590 248 560 Z" fill="url(#body)"/>
  <!-- chest highlight -->
  <path d="M285 470 Q300 430 320 428 Q340 430 355 470 Q340 452 320 450 Q300 452 285 470 Z" fill="#FF9FFC" opacity="0.35"/>
  <!-- collar -->
  <path d="M320 430 L296 462 L320 452 L344 462 Z" fill="#C084FC" opacity="0.55"/>

  <!-- name -->
  <text x="320" y="590" font-family="Kanit,Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="8" fill="#E9D5FF" text-anchor="middle">LI ZHIFENG</text>
  <text x="320" y="635" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="20" letter-spacing="5" fill="#C084FC" text-anchor="middle">李 智 峰</text>
  <text x="320" y="682" font-family="Kanit,Arial,sans-serif" font-size="16" letter-spacing="4" fill="#8f86a8" text-anchor="middle">UE5 TECHNICAL ARTIST</text>
</svg>
